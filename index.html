<!doctype html>

    <meta charset="UTF-8" />

    <script>
      // Safeguard against Chrome extensions (e.g. interceptor.js) attempting to monkey-patch window.fetch
      (function() {
        try {
          var _rawFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = _rawFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            }
          });
        } catch (e) {
          // If property is locked, silently proceed
        }

        // Suppress external browser extension injection errors from breaking the page
        window.addEventListener('error', function(event) {
          var isExtension = event.filename && (
            event.filename.indexOf('chrome-extension://') !== -1 ||
            event.filename.indexOf('moz-extension://') !== -1 ||
            event.filename.indexOf('safari-web-extension://') !== -1
          );
          var isFetchGetterError = event.message && event.message.indexOf('Cannot set property fetch') !== -1;
          if (isExtension || isFetchGetterError) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = event.reason ? String(event.reason) : '';
          if (reasonStr.indexOf('Cannot set property fetch') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
